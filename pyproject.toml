[project]
name = "chain-mcp"
version = "0.1.0"
description = "MCP server exposing Dimitres Kisimov's portfolio optimization/analytics engines as tools for any MCP client."
authors = [{ name = "Dimitres Kisimov" }]
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.2",
    "numpy",
    "pandas",
    "scipy",
    "ortools",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
